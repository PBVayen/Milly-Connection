<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Milly Connection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Cinzel:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root {
  --bg: #02060c; --panel: #08121c; --panel2: #0e1a26; --line: rgba(150,215,245,.14); --line2: rgba(150,215,245,.36);
  --text: #f3f9fd; --silver: #bfe7f8; --muted: #7f9cb0; --dim: #4a6275;
  --chrome: linear-gradient(180deg, #ffffff 0%, #d8f1fc 38%, #5fb3dc 62%, #e4f6ff 100%);
  --up: #8fd8ab; --down: #e89595; --warn: #e3c98a;
  --s1: #f4fbff; --s2: #9fd3ea; --s3: #3f6782;
  --sans: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif; --disp: "Cinzel", Georgia, "Times New Roman", serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace; --r: 14px;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 var(--sans); }
body { background: var(--bg); min-height: 100vh; }
.wrap { position: relative; z-index: 1; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 20px 16px 60px; }
a { color: var(--silver); }
.mono { font-family: var(--mono); }
.up { color: var(--up); } .down { color: var(--down); } .muted { color: var(--muted); } .dim { color: var(--dim); }

/* header */
header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; padding: 6px 0 18px; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: baseline; gap: 12px; }
.brand h1 { margin: 0; font: 700 26px/1 var(--disp); letter-spacing: .14em; }
.sheen { background: linear-gradient(100deg, #5fb3dc 0%, #e6f6ff 30%, #ffffff 42%, #7cc4e6 55%, #d4f0fc 75%, #5fb3dc 100%); background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: sheen 7s ease-in-out infinite; }
@keyframes sheen { 0%, 100% { background-position: 100% 0; } 50% { background-position: 0% 0; } }
.brand span { color: var(--muted); font-size: 12px; letter-spacing: .2em; text-transform: uppercase; }
.status { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.pill { display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); font-size: 12px; color: var(--silver); white-space: nowrap; }
.pill i { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); }
.pill.ok i { background: var(--up); box-shadow: 0 0 8px var(--up); animation: pulse 2.4s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(143,216,171,.55); } 50% { box-shadow: 0 0 0 5px rgba(143,216,171,0); } } .pill.warn i { background: var(--warn); } .pill.bad i { background: var(--down); }
.banner { margin: 14px 0 0; padding: 9px 14px; border: 1px dashed var(--line2); border-radius: 10px; color: var(--silver); font-size: 13px; }

/* sections */
section { margin-top: 26px; scroll-margin-top: 16px; }
h2 { margin: 0 0 12px; font: 500 12px/1 var(--disp); letter-spacing: .22em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 10px; }
h2::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.panel { background: linear-gradient(180deg, rgba(14,28,42,.78), rgba(6,14,24,.8)); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border: 1px solid var(--line); border-radius: var(--r); box-shadow: inset 0 1px 0 rgba(255,255,255,.04); }
section { animation: rise .7s cubic-bezier(.2,.7,.2,1) both; }
section:nth-of-type(2) { animation-delay: .06s; } section:nth-of-type(3) { animation-delay: .12s; } section:nth-of-type(4) { animation-delay: .18s; }

/* strategy cards */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
.card { padding: 16px; cursor: pointer; transition: border-color .2s, transform .2s, box-shadow .2s; position: relative; }
.card:hover { border-color: var(--line2); transform: translateY(-2px); box-shadow: 0 14px 40px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.06); }
.card.on { border-color: var(--silver); box-shadow: 0 0 0 1px rgba(170,225,250,.3), 0 8px 30px rgba(0,0,0,.6); }
.card .top { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
.card h3 { margin: 0; font: 600 17px/1.2 var(--disp); }
.swatch { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 8px; vertical-align: 1px; }
.badge { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; padding: 3px 8px; border-radius: 6px; border: 1px solid var(--line2); color: var(--silver); white-space: nowrap; }
.meta { color: var(--muted); font-size: 12px; margin-top: 4px; }
.rule { color: var(--silver); font-size: 12.5px; margin: 10px 0 12px; min-height: 38px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: rgba(255,255,255,.025); border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; }
.stat b { display: block; font: 500 16px/1.2 var(--mono); }
.stat small { color: var(--dim); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; }
.compare { margin-top: 10px; font-size: 12px; color: var(--muted); display: grid; grid-template-columns: auto 1fr 1fr 1fr; gap: 3px 12px; }
.compare .h { color: var(--dim); font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; }
.replay { margin-top: 10px; font-size: 12px; }
.replay.warn { color: var(--warn); }

/* tabs + charts */
.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.tab { background: var(--panel); color: var(--muted); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; font: 500 13px var(--mono); cursor: pointer; }
.tab.on { color: var(--text); border-color: var(--silver); background: var(--panel2); }
.tab em { font-style: normal; margin-left: 6px; font-size: 11.5px; }
.chartbox { padding: 12px; }
.charthead { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; padding: 2px 4px 10px; font-size: 13px; }
.charthead b { font: 600 15px var(--mono); }
.chart { height: 380px; width: 100%; }
.chart.sm { height: 300px; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--muted); padding: 8px 4px 0; }

/* alerts table */
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-weight: 500; color: var(--dim); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: rgba(255,255,255,.025); }
tbody tr.on td { background: rgba(170,225,250,.07); }
td.num, th.num { text-align: right; font-family: var(--mono); }
.st { font-size: 11px; padding: 2px 8px; border-radius: 6px; border: 1px solid var(--line2); }
.st.goal { color: var(--up); border-color: rgba(143,216,171,.4); } .st.stop { color: var(--down); border-color: rgba(232,149,149,.4); } .st.open { color: var(--text); } .st.close { color: var(--muted); }
.empty { padding: 26px; text-align: center; color: var(--muted); }
.grid2 { display: grid; grid-template-columns: 1fr; gap: 12px; }


/* background: drifting silver light, a grid that fades out, floating dust */
.bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.bg .glow { position: absolute; border-radius: 50%; filter: blur(80px); opacity: .5; }
.bg .g1 { width: 60vmax; height: 60vmax; left: -15vmax; top: -25vmax; background: radial-gradient(circle, rgba(120,200,240,.2), transparent 65%); animation: drift1 38s ease-in-out infinite alternate; }
.bg .g2 { width: 55vmax; height: 55vmax; right: -20vmax; top: 20vh; background: radial-gradient(circle, rgba(70,150,210,.16), transparent 65%); animation: drift2 46s ease-in-out infinite alternate; }
.bg .g3 { width: 45vmax; height: 45vmax; left: 25vw; bottom: -30vmax; background: radial-gradient(circle, rgba(220,245,255,.09), transparent 65%); animation: drift1 54s ease-in-out infinite alternate-reverse; }
@keyframes drift1 { from { transform: translate(0, 0) scale(1); } to { transform: translate(12vw, 8vh) scale(1.12); } }
@keyframes drift2 { from { transform: translate(0, 0) scale(1.05); } to { transform: translate(-10vw, -10vh) scale(.95); } }
.bg .grid { position: absolute; inset: -60px; background-image: linear-gradient(rgba(150,215,245,.055) 1px, transparent 1px), linear-gradient(90deg, rgba(150,215,245,.055) 1px, transparent 1px); background-size: 60px 60px; -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 30%, #000 30%, transparent 80%); mask-image: radial-gradient(ellipse 70% 60% at 50% 30%, #000 30%, transparent 80%); animation: gridpan 60s linear infinite; }
@keyframes gridpan { to { transform: translate(60px, 60px); } }
.bg canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.bg .vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 40%, transparent 55%, rgba(0,0,0,.7) 100%); }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* option chain */
.chain table { font-size: 12.5px; }
.chain th, .chain td { padding: 7px 10px; }
.chain td.k { text-align: center; font: 600 13px var(--mono); color: var(--text); background: rgba(150,215,245,.05); }
.chain th.k { text-align: center; }
.chain th.side { text-align: center; color: var(--silver); letter-spacing: .14em; }
.chain tr.atm td { background: rgba(150,215,245,.10); }
.chain tr.atm td.k { color: #ffffff; box-shadow: inset 0 0 0 1px rgba(150,215,245,.45); }
.chain td.itm { background: rgba(150,215,245,.035); }
.chain .occ { cursor: default; }
.chainhead { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; padding: 12px 14px 4px; font-size: 13px; }

/* full-screen charts: double-tap or double-click a chart */
.chart { cursor: zoom-in; }
.chartbox.full { position: fixed; inset: 0; z-index: 60; margin: 0; border-radius: 0; display: flex; flex-direction: column;
  padding: max(12px, env(safe-area-inset-top, 0px)) max(14px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px));
  background: linear-gradient(180deg, #0b1724, #02060c); animation: none; }
.chartbox.full .chart { flex: 1; height: auto !important; min-height: 0; cursor: zoom-out; }
.chartbox .fullhint { display: none; }
.chartbox.full .fullhint { display: block; position: absolute; top: max(12px, env(safe-area-inset-top, 0px)); right: max(14px, env(safe-area-inset-right, 0px));
  font-size: 12px; color: var(--muted); background: rgba(8,18,28,.8); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; z-index: 2; }
body.has-full { overflow: hidden; }
/* login */
#login { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; z-index: 10; }
#login form { background: linear-gradient(180deg, rgba(16,32,48,.66), rgba(5,13,22,.7)); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); box-shadow: 0 30px 80px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,255,255,.06); animation: rise .9s cubic-bezier(.2,.7,.2,1) both; }
@keyframes rise { from { opacity: 0; transform: translateY(14px) scale(.985); } to { opacity: 1; transform: none; } }
#login form { width: 100%; max-width: 380px; padding: 34px 28px 28px; text-align: center; }
#login h1 { margin: 0 0 28px; font: 700 28px/1.15 var(--disp); letter-spacing: .16em; }
#login input[type=password] { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line2); background: #050c14; color: var(--text); font: 15px var(--sans); outline: none; }
#login input[type=password]:focus { border-color: var(--silver); box-shadow: 0 0 0 3px rgba(170,225,250,.1); }
#login label { display: flex; align-items: center; gap: 8px; justify-content: center; margin: 14px 0 18px; color: var(--muted); font-size: 12.5px; cursor: pointer; }
#login button { width: 100%; padding: 12px; border: 0; border-radius: 10px; background: var(--chrome); color: #04101a; font: 600 14px var(--disp); letter-spacing: .12em; text-transform: uppercase; cursor: pointer; }
#login button:disabled { opacity: .6; cursor: wait; }
#login .err { min-height: 20px; margin-top: 12px; color: var(--down); font-size: 13px; }
.lock { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 999px; padding: 5px 11px; font: 12px var(--sans); cursor: pointer; }
.lock:hover { color: var(--text); border-color: var(--line2); }
body.locked .wrap { display: none; }

.pages { display: flex; gap: 6px; margin-top: 16px; }
.pages a { padding: 7px 16px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); text-decoration: none; font: 500 11px/1.4 var(--disp); letter-spacing: .2em; text-transform: uppercase; background: var(--panel); transition: color .2s, border-color .2s; }
.pages a:hover { color: var(--text); border-color: var(--line2); }
.pages a.on { color: var(--text); border-color: var(--silver); box-shadow: 0 0 0 1px rgba(170,225,250,.18); }
.pages a.cup { color: #f7a3ae; } .pages a.cup.on { border-color: rgba(239,91,110,.6); box-shadow: 0 0 0 1px rgba(239,91,110,.15), 0 0 24px rgba(239,91,110,.18); }
#webpage { display: none; }
#webpage iframe { display: block; width: 100%; height: 1400px; border: 0; background: transparent; }
body.page-web .wrap > section:not(#webpage), body.page-web #banner { display: none; }
body.page-web #webpage { display: block; }
/* Cupinator's strategies carry a red hue */
.card.owner-cup { border-color: rgba(239,91,110,.38); box-shadow: 0 0 0 1px rgba(239,91,110,.10), 0 0 30px rgba(239,91,110,.14), inset 0 1px 0 rgba(255,255,255,.04); }
.card.owner-cup:hover, .card.owner-cup.on { border-color: rgba(239,91,110,.7); }
.card.owner-cup h3 { color: #f7a3ae; }
footer { margin-top: 40px; color: var(--dim); font-size: 12px; text-align: center; }
@media (max-width: 640px) { .chart { height: 300px; } .chart.sm { height: 240px; } .brand h1 { font-size: 21px; } .stats { grid-template-columns: repeat(3, 1fr); } }
</style>
</head>

<script>
// Silver dust: a few slow specks drifting up. Pauses when the tab is hidden; off for reduced motion.
(() => {
  const c = document.getElementById("dust"), x = c.getContext("2d");
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  let w, h, dpr, pts = [], running = false;
  const size = () => {
    dpr = Math.min(2, devicePixelRatio || 1); w = c.clientWidth; h = c.clientHeight;
    c.width = w * dpr; c.height = h * dpr; x.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.round(Math.min(70, w * h / 22000));
    pts = Array.from({ length: n }, () => ({ x: Math.random() * w, y: Math.random() * h, r: Math.random() * 1.2 + .3,
      v: Math.random() * .12 + .03, a: Math.random() * .45 + .1, t: Math.random() * 6.28 }));
  };
  const step = () => {
    if (document.hidden) { running = false; return; }
    x.clearRect(0, 0, w, h);
    for (const p of pts) {
      p.y -= p.v; p.t += .01; p.x += Math.sin(p.t) * .08;
      if (p.y < -4) { p.y = h + 4; p.x = Math.random() * w; }
      x.globalAlpha = p.a * (.6 + .4 * Math.sin(p.t * 1.7));
      x.fillStyle = "#dff4ff"; x.beginPath(); x.arc(p.x, p.y, p.r, 0, 6.283); x.fill();
    }
    requestAnimationFrame(step);
  };
  const go = () => { if (!running && !document.hidden) { running = true; requestAnimationFrame(step); } };
  addEventListener("resize", size); document.addEventListener("visibilitychange", go);
  size(); go();
})();
</script>

<script>if (!(window.DESK_CONFIG || {}).dataUrl) document.write('<script src="sample-data.js?v=' + Date.now() + '"><\/script>')</script>
<script>
(() => {
  const CFG = window.DESK_CONFIG || {};
  const LWC = window.LightweightCharts;
  const SHADE = ["#f4fbff", "#9fdcf5", "#4fa3cf", "#d4f0fc", "#78c2e4"];
  const state = { data: null, filter: null, ticker: null, alertId: null };
  const charts = {};

  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const pct = (v, d = 1) => v == null ? "–" : (v > 0 ? "+" : "") + Number(v).toFixed(d) + "%";
  const cls = v => v == null ? "" : v > 0 ? "up" : v < 0 ? "down" : "";
  const money = v => v == null ? "–" : "$" + Number(v).toFixed(2);
  const etT = (day, hhmm) => { const [y, m, d] = day.split("-").map(Number); const [h, mi] = hhmm.split(":").map(Number); return Date.UTC(y, m - 1, d, h, mi) / 1000; };
  const strat = key => (state.data.strategies || []).find(s => s.key === key) || { name: key, key };
  const shade = key => SHADE[Math.max(0, (state.data.strategies || []).findIndex(s => s.key === key)) % SHADE.length];
  const short = key => { const n = strat(key).name || key; const m = n.match(/\b([A-Z])(?:\s*v[\d.]+)?$/); return m ? m[1] : n.split(/\s+/).map(w => w[0]).join("").toUpperCase(); };

  // ---------- data ----------
  function stampUrl(url, minutesBack) {
    const d = new Date(Date.now() - minutesBack * 60000), p = n => String(n).padStart(2, "0");
    const stamp = `${d.getUTCFullYear()}${p(d.getUTCMonth() + 1)}${p(d.getUTCDate())}${p(d.getUTCHours())}${p(d.getUTCMinutes())}`;
    return url.includes("{stamp}") ? url.replace("{stamp}", stamp) : url + (url.includes("?") ? "&" : "?") + "t=" + Date.now();
  }
  async function fetchBox() {
    if (!CFG.dataUrl) return window.SAMPLE_BOX;
    for (const back of [0, 1, 2]) {
      try {
        const r = await fetch(stampUrl(CFG.dataUrl, back), { cache: "no-store" });
        if (r.ok) return await r.json();
      } catch (e) { /* try the previous minute */ }
      if (!CFG.dataUrl.includes("{stamp}")) break;
    }
    if (CFG.fallbackUrl) {
      // outside market hours nothing new is pushed, so the per-minute files run out: read the latest snapshot
      const r = await fetch(CFG.fallbackUrl + "?t=" + Date.now(), { cache: "no-store" });
      if (r.ok) return await r.json();
    }
    throw new Error("could not load data");
  }

  // ---------- passphrase (the data is AES-GCM encrypted by the bot; see seal.py) ----------
  const KEY_STORE = "vcdesk.key";
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const toB64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
  let key = null;
  const store = {
    get() { try { return sessionStorage.getItem(KEY_STORE) || localStorage.getItem(KEY_STORE); } catch (e) { return null; } },
    set(v, remember) { try { sessionStorage.setItem(KEY_STORE, v); if (remember) localStorage.setItem(KEY_STORE, v); } catch (e) { } },
    clear() { try { sessionStorage.removeItem(KEY_STORE); localStorage.removeItem(KEY_STORE); } catch (e) { } },
  };
  async function deriveKey(pass, box) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({ name: "PBKDF2", hash: "SHA-256", salt: b64(box.salt), iterations: box.iter },
      base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
  }
  async function open(box, k) {
    const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(box.iv) }, k, b64(box.ct));
    return JSON.parse(new TextDecoder().decode(pt));
  }
  async function load() { return open(await fetchBox(), key); }

  async function restoreKey() {
    const saved = store.get();
    if (!saved) return false;
    try {
      const [salt, raw] = saved.split(":");
      const box = await fetchBox();
      if (salt !== box.salt) { store.clear(); return false; }
      key = await crypto.subtle.importKey("raw", b64(raw), { name: "AES-GCM" }, false, ["decrypt"]);
      state.data = await open(box, key);
      return true;
    } catch (e) { store.clear(); key = null; return false; }
  }

  // ---------- pages: the desk, and the confluence web (web.html, shown in place) ----------
  function page(name) {
    const web = name === "web";
    document.body.classList.toggle("page-web", web);
    document.querySelectorAll(".pages a").forEach(a => a.classList.toggle("on", a.dataset.page === name));
    const f = $("webframe");
    if (web && !f.src) f.src = "web.html?embed=1";
  }
  document.querySelectorAll(".pages a").forEach(a => a.onclick = ev => {
    ev.preventDefault(); page(a.dataset.page);
    history.replaceState(null, "", a.dataset.page === "web" ? "#web" : location.pathname + location.search);
    scrollTo({ top: 0 });
  });
  addEventListener("message", ev => {
    if (ev.origin === location.origin && ev.data && ev.data.webHeight) $("webframe").style.height = Math.ceil(ev.data.webHeight) + "px";
  });

  function unlocked() {
    if (location.hash === "#web") page("web");
    document.body.classList.remove("locked");
    $("login").style.display = "none";
    renderAll(true);
    if (location.hash && location.hash !== "#web") { const t = document.getElementById(location.hash.slice(1)); if (t) requestAnimationFrame(() => t.scrollIntoView()); }
    if (CFG.dataUrl) setInterval(tick, (CFG.refreshSeconds || 60) * 1000);
  }

  $("login").querySelector("form").onsubmit = async ev => {
    ev.preventDefault();
    const btn = $("unlock"); btn.disabled = true; $("err").textContent = "";
    try {
      if (!window.crypto || !crypto.subtle) throw new Error("This browser can't decrypt here (needs https).");
      const box = await fetchBox();
      const k = await deriveKey($("pass").value, box);
      let data;
      try { data = await open(box, k); } catch (e) { throw new Error("Wrong passphrase."); }
      key = k; state.data = data;
      store.set(box.salt + ":" + toB64(await crypto.subtle.exportKey("raw", k)), $("remember").checked);
      $("pass").value = "";
      unlocked();
    } catch (e) { $("err").textContent = e.message; }
    finally { btn.disabled = false; }
  };
  $("lock").onclick = () => { store.clear(); location.reload(); };

  // ---------- charts ----------
  function chart(id, opts = {}) {
    if (charts[id]) return charts[id];
    const c = LWC.createChart($(id), {
      autoSize: true,
      layout: { background: { type: "solid", color: "transparent" }, textColor: "#7f9cb0", fontFamily: "JetBrains Mono, monospace", fontSize: 11 },
      grid: { vertLines: { color: "rgba(150,215,245,.06)" }, horzLines: { color: "rgba(150,215,245,.06)" } },
      rightPriceScale: { borderColor: "rgba(150,215,245,.14)" },
      timeScale: { borderColor: "rgba(150,215,245,.14)", timeVisible: true, secondsVisible: false },
      crosshair: { mode: 0, vertLine: { color: "rgba(170,225,250,.4)", labelBackgroundColor: "#163349" }, horzLine: { color: "rgba(170,225,250,.4)", labelBackgroundColor: "#163349" } },
      ...opts,
    });
    charts[id] = { c, series: [] };
    return charts[id];
  }
  function clear(ch) { ch.series.forEach(s => ch.c.removeSeries(s)); ch.series = []; }
  function candles(ch, bars) {
    const s = ch.c.addCandlestickSeries({ upColor: "#e6f6ff", downColor: "#12263a", borderUpColor: "#e6f6ff", borderDownColor: "#7f9cb0", wickUpColor: "#a9dcf3", wickDownColor: "#3f6782" });
    s.setData(bars.map(b => ({ time: b[0], open: b[1], high: b[2], low: b[3], close: b[4] })));
    ch.series.push(s);
    return s;
  }

  // ---------- render ----------
  function renderStatus(d) {
    const gen = new Date(d.generated), age = (Date.now() - gen) / 60000;
    const time = gen.toLocaleTimeString("en-US", { timeZone: "America/New_York", hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false });
    let live = d.market === "open" ? (d.sample || age < 3 ? ["ok", "Live"] : ["warn", "Stale"]) : ["", "Market closed"];
    let html = `<span class="pill ${live[0]}"><i></i>${live[1]} · ${esc(time)} ET</span>`;
    for (const [name, st] of Object.entries((d.bot || {}).sources || {}))
      html += `<span class="pill ${st === "ok" ? "ok" : st === "down" ? "bad" : "warn"}"><i></i>${esc(name)}</span>`;
    $("status").innerHTML = html;
    const errs = (d.bot || {}).errors || [];
    $("banner").innerHTML = (d.sample ? `<div class="banner">Sample data: a made-up day so the layout can be checked. The real feed starts when the merged bot publishes.</div>` : "")
      + errs.map(e => `<div class="banner" style="color:var(--warn)">${esc(e)}</div>`).join("");
  }

  function renderCards(d) {
    $("cards").innerHTML = d.strategies.map(s => {
      const today = d.alerts.filter(a => a.strategy === s.key), open = today.filter(a => a.status === "open");
      const done = today.filter(a => a.result_pct != null);
      const f = s.forward || {}, t = s.tested || {}, rp = f.replay || {};
      const winF = f.alerts ? Math.round(100 * f.wins / f.alerts) : null;
      const bad = rp.checked_days && rp.matched_days < rp.checked_days;
      const row = (label, o) => o ? `<span>${label}</span><span class="mono">${o.trades ?? o.alerts ?? "–"}</span><span class="mono">${o.win ?? "–"}${o.win != null ? "%" : ""}</span><span class="mono ${cls(o.avg)}">${pct(o.avg)}</span>` : "";
      return `<div class="panel card ${state.filter === s.key ? "on" : ""} ${/cup/i.test(s.owner || "") ? "owner-cup" : ""}" data-key="${esc(s.key)}">
        <div class="top"><h3><span class="swatch" style="background:${shade(s.key)}"></span>${esc(s.name)}</h3><span class="badge">${esc(s.mode || "")}</span></div>
        <div class="meta">${esc(s.owner)} · #${esc(s.channel || "no channel")}</div>
        <div class="rule">${esc(s.rule || "")}</div>
        <div class="stats">
          <div class="stat"><b>${today.length}</b><small>alerts today</small></div>
          <div class="stat"><b>${open.length}</b><small>open</small></div>
          <div class="stat"><b class="${cls(done.reduce((a, x) => a + x.result_pct, 0))}">${done.length ? pct(done.reduce((a, x) => a + x.result_pct, 0) / done.length) : "–"}</b><small>avg closed</small></div>
        </div>
        <div class="compare">
          <span class="h"></span><span class="h">trades</span><span class="h">win</span><span class="h">avg</span>
          ${row("Forward", { alerts: f.alerts, win: winF, avg: f.avg })}
          ${row("Backtest dev", t.dev)}
          ${row("2nd check", t.check)}
        </div>
        ${rp.checked_days ? `<div class="replay ${bad ? "warn" : "muted"}">Replay match: ${rp.matched_days}/${rp.checked_days} days${bad && rp.note ? " · " + esc(rp.note) : ""}</div>` : ""}
      </div>`;
    }).join("");
    $("cards").querySelectorAll(".card").forEach(el => el.onclick = () => {
      state.filter = state.filter === el.dataset.key ? null : el.dataset.key;
      renderAll(false);
    });
  }

  function visibleAlerts(d) { return d.alerts.filter(a => !state.filter || a.strategy === state.filter); }

  function renderMarkets(d) {
    const tickers = Object.keys(d.markets || {});
    if (!tickers.length) { $("mtabs").innerHTML = ""; $("mhead").innerHTML = `<span class="muted">No market data yet.</span>`; return; }
    if (!state.ticker || !tickers.includes(state.ticker)) state.ticker = tickers[0];
    $("mtabs").innerHTML = tickers.map(t => { const m = d.markets[t]; return `<button class="tab ${t === state.ticker ? "on" : ""}" data-t="${esc(t)}">${esc(t)}<em class="${cls(m.change_pct)}">${pct(m.change_pct, 2)}</em></button>`; }).join("");
    $("mtabs").querySelectorAll(".tab").forEach(b => b.onclick = () => { state.ticker = b.dataset.t; renderMarkets(d); });
    const m = d.markets[state.ticker];
    $("mhead").innerHTML = `<span><b>${esc(state.ticker)}</b> <span class="mono">${money(m.last).slice(1)}</span> <span class="${cls(m.change_pct)} mono">${pct(m.change_pct, 2)}</span></span><span class="muted">1-minute · ET</span>`;
    const ch = chart("mchart"); clear(ch);
    const s = candles(ch, m.bars);
    if (m.bars.length && m.bars[0].length > 5 && m.bars.some(b => b[5])) {
      const v = ch.c.addHistogramSeries({ priceScaleId: "vol", priceFormat: { type: "volume" }, lastValueVisible: false, priceLineVisible: false });
      ch.c.priceScale("vol").applyOptions({ scaleMargins: { top: .82, bottom: 0 } });
      v.setData(m.bars.map(b => ({ time: b[0], value: b[5] || 0, color: b[4] >= b[1] ? "rgba(190,232,252,.22)" : "rgba(60,110,150,.3)" })));
      ch.series.push(v);
    }
    const marks = visibleAlerts(d).filter(a => a.ticker === state.ticker).map(a => ({
      time: etT(d.day, a.time), position: a.side === "put" ? "aboveBar" : "belowBar", color: shade(a.strategy),
      shape: a.side === "put" ? "arrowDown" : "arrowUp", text: `${short(a.strategy)} ${a.side === "put" ? "P" : "C"}`,
    })).sort((x, y) => x.time - y.time);
    s.setMarkers(marks);
    ch.c.timeScale().fitContent();
    renderChain(d);
    const keys = [...new Set(visibleAlerts(d).map(a => a.strategy))];
    $("mlegend").innerHTML = keys.map(k => `<span><span class="swatch" style="background:${shade(k)}"></span>${esc(strat(k).name)}</span>`).join("") + `<span class="dim">▲ call · ▼ put</span>`;
  }


  function renderChain(d) {
    const c = (d.chains || {})[state.ticker];
    if (!c || !c.rows || !c.rows.length) {
      const down = ((d.bot || {}).sources || {})["Webull options"] === "down" || ((d.bot || {}).sources || {}).Webull === "down";
      $("chainhead").innerHTML = `<span><b>${esc(state.ticker || "")}</b> options</span>`;
      $("chain").innerHTML = `<div class="empty">${down ? "Option prices come from Webull, which isn't answering right now." : "No option chain for this ticker yet."}</div>`;
      return;
    }
    const n = (v, dgt = 2) => v == null ? '<span class="dim">–</span>' : Number(v).toFixed(dgt);
    const vol = v => v == null ? '<span class="dim">–</span>' : Number(v).toLocaleString("en-US");
    const exp = new Date(c.expiry + "T12:00:00Z").toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric", timeZone: "UTC" });
    $("chainhead").innerHTML = `<span><b>${esc(state.ticker)}</b> options · ${esc(exp)}${c.expiry === d.day ? " (0DTE)" : ""}</span><span class="muted">spot ${n(c.spot)} · Webull ${esc(c.asof || "")} ET</span>`;
    const side = (q, itm) => q ? `<td class="num ${itm ? "itm" : ""}">${n(q.bid)}</td><td class="num ${itm ? "itm" : ""}">${n(q.ask)}</td><td class="num ${itm ? "itm" : ""}">${n(q.last)}</td><td class="num ${itm ? "itm" : ""}">${vol(q.vol)}</td><td class="num ${itm ? "itm" : ""}">${n(q.delta, 2)}</td>`
      : `<td class="num dim" colspan="5">–</td>`;
    const sideR = (q, itm) => q ? `<td class="num ${itm ? "itm" : ""}">${n(q.delta, 2)}</td><td class="num ${itm ? "itm" : ""}">${vol(q.vol)}</td><td class="num ${itm ? "itm" : ""}">${n(q.last)}</td><td class="num ${itm ? "itm" : ""}">${n(q.bid)}</td><td class="num ${itm ? "itm" : ""}">${n(q.ask)}</td>`
      : `<td class="num dim" colspan="5">–</td>`;
    $("chain").innerHTML = `<table><thead>
      <tr><th class="side" colspan="5">Calls</th><th class="k"></th><th class="side" colspan="5">Puts</th></tr>
      <tr><th class="num">Bid</th><th class="num">Ask</th><th class="num">Last</th><th class="num">Vol</th><th class="num">Δ</th><th class="k">Strike</th><th class="num">Δ</th><th class="num">Vol</th><th class="num">Last</th><th class="num">Bid</th><th class="num">Ask</th></tr>
      </thead><tbody>` + c.rows.map(r => `<tr class="${r.strike === c.atm ? "atm" : ""}">${side(r.call, r.strike < c.spot)}<td class="k">${n(r.strike, r.strike % 1 ? 1 : 0)}</td>${sideR(r.put, r.strike > c.spot)}</tr>`).join("") + `</tbody></table>`;
  }

  // ---------- full-screen charts: double-tap (phone) or double-click (desktop); again or Esc to close ----------
  let lastToggle = 0;
  function toggleFull(box) {
    if (Date.now() - lastToggle < 450) return;
    lastToggle = Date.now();
    const on = !box.classList.contains("full");
    document.querySelectorAll(".chartbox.full").forEach(b => b.classList.remove("full"));
    box.classList.toggle("full", on);
    document.body.classList.toggle("has-full", on);
    try {
      if (on && box.requestFullscreen) box.requestFullscreen().catch(() => {});
      else if (!on && document.fullscreenElement) document.exitFullscreen().catch(() => {});
    } catch (e) { /* the overlay alone still works */ }
  }
  document.addEventListener("fullscreenchange", () => {
    if (!document.fullscreenElement) { document.querySelectorAll(".chartbox.full").forEach(b => b.classList.remove("full")); document.body.classList.remove("has-full"); }
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape") { const b = document.querySelector(".chartbox.full"); if (b) toggleFull(b); } });
  document.querySelectorAll(".chartbox").forEach(box => {
    const chartEl = box.querySelector(".chart");
    if (!chartEl) return;
    const hint = document.createElement("div"); hint.className = "fullhint"; hint.textContent = "Double-tap to close";
    box.appendChild(hint);
    chartEl.addEventListener("dblclick", () => toggleFull(box));
    let tap = 0, tx = 0, ty = 0;
    chartEl.addEventListener("touchend", e => {
      if (e.touches.length || e.changedTouches.length !== 1) return;
      const t = e.changedTouches[0], now = Date.now();
      if (now - tap < 320 && Math.abs(t.clientX - tx) < 30 && Math.abs(t.clientY - ty) < 30) { e.preventDefault(); tap = 0; toggleFull(box); }
      else { tap = now; tx = t.clientX; ty = t.clientY; }
    }, { passive: false });
  });

  function renderAlerts(d) {
    const rows = visibleAlerts(d).slice().sort((a, b) => a.time < b.time ? 1 : -1);
    if (!rows.length) { $("alerts").innerHTML = `<div class="empty">No alerts${state.filter ? " for " + esc(strat(state.filter).name) : ""} yet today.</div>`; $("cbox").style.display = "none"; return; }
    $("cbox").style.display = "";
    if (!rows.some(a => a.id === state.alertId)) state.alertId = (rows.find(a => a.status === "open") || rows[0]).id;
    $("alerts").innerHTML = `<table><thead><tr><th>Time</th><th>Strategy</th><th>Contract</th><th class="num">Entry</th><th class="num">Bid / Ask</th><th class="num">Last</th><th class="num">Now</th><th class="num">Peak</th><th class="num">Goal</th><th class="num">Stop</th><th>Status</th></tr></thead><tbody>`
      + rows.map(a => `<tr class="${a.id === state.alertId ? "on" : ""}" data-id="${a.id}">
        <td class="mono">${esc(a.time)}</td>
        <td><span class="swatch" style="background:${shade(a.strategy)}"></span>${esc(strat(a.strategy).name)}</td>
        <td class="mono">${esc(a.ticker)} ${esc(a.side)} <span class="dim">${esc(a.contract)}</span></td>
        <td class="num">${money(a.entry)}</td><td class="num">${a.quote && a.quote.bid != null ? money(a.quote.bid) + " / " + money(a.quote.ask) : '<span class="dim">–</span>'}</td><td class="num">${money(a.last)}</td>
        <td class="num ${cls(a.result_pct ?? a.pct)}">${pct(a.result_pct ?? a.pct)}</td>
        <td class="num">${pct(a.peak_pct)}</td><td class="num">${money(a.goal)}</td><td class="num">${a.stop == null ? '<span class="dim">none</span>' : money(a.stop)}</td>
        <td><span class="st ${esc(a.status)}">${esc(a.status)}${a.closed ? " " + esc(a.closed) : ""}</span></td></tr>`).join("")
      + `</tbody></table>`;
    $("alerts").querySelectorAll("tbody tr").forEach(tr => tr.onclick = () => { state.alertId = Number(tr.dataset.id); renderAlerts(d); });
    renderContract(d, rows.find(a => a.id === state.alertId));
  }

  function renderContract(d, a) {
    $("chead").innerHTML = `<span><b>${esc(a.contract)}</b> <span class="muted">${esc(strat(a.strategy).name)} · ${esc(a.time)} ET</span></span>`
      + `<span class="mono"><span class="muted">entry</span> ${money(a.entry)} · <span class="muted">now</span> <span class="${cls(a.result_pct ?? a.pct)}">${pct(a.result_pct ?? a.pct)}</span> · <span class="muted">peak</span> ${pct(a.peak_pct)}</span>`;
    const ch = chart("cchart"); clear(ch);
    if (!a.bars || !a.bars.length) return;
    const s = candles(ch, a.bars);
    const line = (price, title, color, style) => price != null && s.createPriceLine({ price, title, color, lineWidth: 1, lineStyle: style, axisLabelVisible: true });
    line(a.entry, "entry", "#bfe7f8", 0);
    line(a.goal, "goal", "#8fd8ab", 2);
    line(a.stop, "stop", "#e89595", 2);
    const marks = [{ time: a.bars[0][0], position: "belowBar", color: "#f4fbff", shape: "arrowUp", text: "buy" }];
    if (a.closed) marks.push({ time: etT(d.day, a.closed), position: "aboveBar", color: a.status === "goal" ? "#8fd8ab" : a.status === "stop" ? "#e89595" : "#7f9cb0", shape: "arrowDown", text: a.status });
    s.setMarkers(marks);
    ch.c.timeScale().fitContent();
  }

  function renderResults(d) {
    const days = (d.history || {}).days || [];
    const keys = d.strategies.map(s => s.key).filter(k => !state.filter || k === state.filter);
    const ch = chart("rchart"); clear(ch);
    $("rnote").textContent = days.length ? `${days[0].day} to ${days[days.length - 1].day}` : "";
    keys.forEach(k => {
      let run = 0;
      const s = ch.c.addLineSeries({ color: shade(k), lineWidth: 2, priceLineVisible: false, lastValueVisible: true, priceFormat: { type: "custom", formatter: v => (v > 0 ? "+" : "") + v.toFixed(0) + "%" } });
      s.setData(days.map(r => { run += ((r.s || {})[k] || {}).sum_pct || 0; return { time: r.day, value: Math.round(run * 10) / 10 }; }));
      ch.series.push(s);
    });
    ch.c.timeScale().fitContent();
    $("rlegend").innerHTML = keys.map(k => `<span><span class="swatch" style="background:${shade(k)}"></span>${esc(strat(k).name)}</span>`).join("");

    if (!days.length) { $("days").innerHTML = `<div class="empty">No forward-test days yet.</div>`; return; }
    const cell = c => !c || !c.n ? `<td class="num dim">–</td>` : `<td class="num"><span class="muted">${c.n}×</span> <span class="${cls(c.sum_pct)}">${pct(c.sum_pct / c.n)}</span> <span class="dim">${c.wins}W</span></td>`;
    const months = {};
    days.forEach(r => { const m = r.day.slice(0, 7); months[m] = months[m] || {}; keys.forEach(k => { const c = (r.s || {})[k]; if (!c) return; const t = months[m][k] = months[m][k] || { n: 0, wins: 0, sum_pct: 0 }; t.n += c.n; t.wins += c.wins; t.sum_pct += c.sum_pct; }); });
    const head = `<tr><th>Day</th>${keys.map(k => `<th class="num">${esc(strat(k).name)}</th>`).join("")}</tr>`;
    const monthRows = Object.entries(months).reverse().map(([m, t]) => `<tr><td class="mono"><b>${esc(m)}</b> <span class="dim">month</span></td>${keys.map(k => cell(t[k])).join("")}</tr>`).join("");
    const dayRows = days.slice().reverse().map(r => `<tr><td class="mono">${esc(r.day)}</td>${keys.map(k => cell((r.s || {})[k])).join("")}</tr>`).join("");
    $("days").innerHTML = `<table><thead>${head}</thead><tbody>${monthRows}${dayRows}</tbody></table>`;
    $("days").querySelectorAll("tbody tr").forEach(tr => tr.style.cursor = "default");
  }

  function renderAll(fresh) {
    const d = state.data;
    renderStatus(d); renderCards(d); renderMarkets(d); renderAlerts(d); renderResults(d);
  }

  async function tick() {
    try { state.data = await load(); renderAll(true); }
    catch (e) { $("banner").innerHTML = `<div class="banner" style="color:var(--warn)">Couldn't read the latest data (${esc(e.message || "decrypt failed")}). Showing the last update.</div>`; }
  }
  restoreKey().then(ok => ok ? unlocked() : $("pass").focus());
})();
</script>
</body>
</html>
